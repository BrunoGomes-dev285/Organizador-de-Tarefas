<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrando Novas Tarefas</title>
</head>
<body>
<!--/*@thymesVar id="tarefa" type="org.example.tarefas_academicas.model.Tarefa"*/-->
<form th:action="@{/templates/tarefas}"
      th:object="${tarefa}"
      method="post">

    <label>Título</label>
    <input type="text" th:field="*{titulo}">
    <span th:if="${#fields.hasErrors('titulo')}"
          th:errors="*{titulo}">
    </span>

    <label>Descricao</label>
    <input type="text" th:field="*{descricao}">
    <span th:if="${#fields.hasErrors('descricao')}"
          th:errors="*{descricao}">
    </span>

    <label>Prazo</label>
    <input type="date" th:field="*{prazo}">
    <span th:if="${#fields.hasErrors('prazo')}"
          th:errors="*{prazo}">
    </span>

    <label>Prioridade</label>
    <select th:field = "*{prioridade}">
        <option>Selecione</option>
        <option th:each ="item:${prioridades}" th:value ="${item}" th:text ="${item}"></option>
    </select>
    <span th:if="${#fields.hasErrors('prazo')}"
    th:errors="*{prazo}">

    </span>

    <label>Status Tarefa</label>
    <select th:field = "*{status}">
        <option>Selecione</option>
        <option th:each ="item:${status}" th:value ="${item}" th:text ="${item}"></option>
    </select>
    <span th:if="${#fields.hasErrors('status')}"
          th:errors="*{status}">

    </span>


    <!-- completar os demais campos -->
    <button type="submit">Cadastrar</button>

    <br>

    <a href="lista.html">Lista de Tarefas</a>
</form>

</body>
</html>
